name: CI/CD Pipeline - Node.js Build, Test, DockerHub & EC2 Deployment

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # STAGE 1: Testing & Code Validation Stage
  # ==========================================
  test:
    name: 🧪 Automated Testing & Validation Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run Integration & Unit Tests
        run: npm test

      # Error Handling & Reporting Step
      - name: Handle Testing Failures
        if: failure()
        run: |
          echo "===================================================="
          echo "❌ CRITICAL ERROR: Unit/Integration tests failed!"
          echo "Pipeline execution aborted. Bad build prevented from moving to Docker stage."
          echo "===================================================="
          exit 1

  # ==========================================
  # STAGE 2: Build Node App & Docker Image Stage
  # ==========================================
  build-and-push-docker:
    name: 🐳 Docker Build & Push to DockerHub Stage
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # Only push image on direct branch pushes (not PRs)

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Official Docker Buildx setup action



      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/node-ec2-docker-todo
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Error Handling for Docker Build & Push
      - name: Handle Docker Build Failure
        if: failure()
        run: |
          echo "===================================================="
          echo "❌ CRITICAL ERROR: Docker Image build or push failed!"
          echo "Check DockerHub credentials (DOCKER_USERNAME, DOCKER_PASSWORD)."
          echo "===================================================="
          exit 1

  # ==========================================
  # STAGE 3: Deploy to AWS EC2 Instance
  # ==========================================
  deploy-to-ec2:
    name: 🚀 Deploy Container to AWS EC2 Stage
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "===================================================="
            echo "🚀 Starting Automated Deployment on EC2 Instance"
            echo "===================================================="

            # Step 1: Log into DockerHub on EC2
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Step 2: Pull latest image from DockerHub
            echo "📥 Pulling latest image: ${{ secrets.DOCKER_USERNAME }}/node-ec2-docker-todo:latest"
            docker pull ${{ secrets.DOCKER_USERNAME }}/node-ec2-docker-todo:latest

            # Step 3: Stop and remove previous container safely if running
            if [ $(docker ps -a -q -f name=node-crud-app) ]; then
              echo "🛑 Stopping existing container 'node-crud-app'..."
              docker stop node-crud-app || true
              echo "🧹 Removing old container..."
              docker rm node-crud-app || true
            fi

            # Step 4: Run new container with restart policy
            echo "▶️ Launching new container instance..."
            docker run -d \
              --name node-crud-app \
              --restart always \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e PORT=3000 \
              ${{ secrets.DOCKER_USERNAME }}/node-ec2-docker-todo:latest

            # Step 5: Verify container health
            echo "🩺 Verifying application health status..."
            sleep 5
            if docker ps | grep node-crud-app; then
              echo "✅ Container is running successfully!"
              curl -s http://localhost:3000/health || echo "⚠️ Warning: Health endpoint check returned non-200 status."
            else
              echo "❌ ERROR: Container failed to stay alive!"
              docker logs node-crud-app --tail 50
              exit 1
            fi

      # Error Handling & Rollback Notification for EC2 Deployment
      - name: Handle Deployment Failure
        if: failure()
        run: |
          echo "===================================================="
          echo "❌ CRITICAL ERROR: AWS EC2 Deployment Failed!"
          echo "Check EC2 SSH connection, Docker installation, or Security Group port 22."
          echo "===================================================="
          exit 1
